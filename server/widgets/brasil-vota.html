<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brasil Vota · Especial Cíclico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#0f3785;--brand-d:#0a2a68;--ink:#14213D;--mut:#68748F;--paper:#fff;--card:#F3F6FB;--band:#EAEFF8;--line:#DAE2F0;--gold:#F1D26A;--green:#4DB680;
  --f:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button{font-family:var(--f)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bv{max-width:1040px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}

/* ===== Card principal ===== */
.hd{cursor:pointer;padding:22px 28px 0;color:var(--ink);background:#fff;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .25s}
.hd:hover{background:#FAFBFE}
.kick{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:22px;height:2px;background:#E0AE00}
.ttl{display:flex;align-items:center;gap:16px;margin-top:12px}
.flag{width:clamp(38px,7vw,52px);height:auto;flex:none;border-radius:3px;box-shadow:0 0 0 1px var(--line);transition:transform .35s}
.hd:hover .flag{transform:rotate(-4deg) scale(1.05)}
.tt{min-width:0}
.sub{margin-top:5px;font-size:clamp(11px,2.2vw,14px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#E0AE00}
h1{font-weight:800;font-size:clamp(17px,3.9vw,30px);line-height:1;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
h1 span{display:inline-block;color:var(--brand);animation:lt 16s ease-in-out infinite}
h1 span.sp{width:.3em}
@keyframes lt{0%,24%{color:var(--brand)}44%{color:#E0AE00}64%{color:#1E9B57}84%,100%{color:var(--brand)}}

/* Línea de tiempo: cómo avanza el asunto, con la etapa actual resaltada */
.tl{list-style:none;display:flex;position:relative;margin-top:22px;--k:0}
.tl::before,.tl::after{content:"";position:absolute;top:5px;left:10%;height:2px;border-radius:1px}
.tl::before{right:10%;background:var(--line)}
.tl::after{width:calc((100% - 20%) * var(--k));background:var(--brand);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tl li{flex:1;text-align:center;position:relative;z-index:1;min-width:0}
.tl i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto;background:#fff;border:2px solid #B7C4E3;transition:all .35s}
.tl span{display:block;margin-top:9px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8793AE;padding:0 3px;line-height:1.25;transition:color .3s}
.tl li.done i{background:var(--brand);border-color:var(--brand)}
.tl li.done span{color:#4A5878}
.tl li.on i{width:16px;height:16px;margin-top:-2px;background:#fff;border:4px solid var(--brand);box-shadow:0 0 0 4px rgba(15,55,133,.16);animation:ring 2.2s ease-in-out infinite}
.tl li.on span{color:var(--brand);font-weight:800}
.tl li.next i{border-style:dashed;border-color:var(--brand)}
.tl li:hover i{transform:scale(1.25)}
@keyframes ring{0%,100%{box-shadow:0 0 0 4px rgba(15,55,133,.16)}50%{box-shadow:0 0 0 9px rgba(15,55,133,.05)}}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:13px 0 14px;border-top:1px solid var(--line)}
.status{font-size:11px;color:var(--mut);min-width:0}
.status b{font-weight:700;color:var(--ink)}
.more{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--brand);border-radius:999px;color:var(--brand);font:600 11px var(--f);padding:7px 14px 7px 16px;cursor:pointer;flex:none;transition:background .2s,transform .2s}
.more:hover{background:var(--brand);color:#fff}
.more:active{transform:scale(.96)}
.more svg{width:16px;height:16px;transition:transform .45s}
.hd:hover .more svg{transform:translateY(2px)}
.open .more svg,.open .hd:hover .more svg{transform:rotate(180deg)}
.more.new{background:var(--gold);border-color:#E0AE00;color:#0a2a68}
.more.new svg{animation:bounce 1.3s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(-1px)}50%{transform:translateY(3px)}}

/* Newsticker chico bajo la card. OCULTO (ya pasó la jornada): para volver a usarlo, borrar la regla ".tk{display:none!important}" de abajo. */
.tk{display:none!important}
.tk{background:var(--card);color:var(--mut);height:24px;overflow:hidden;display:flex;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tk .lb{flex:none;background:#E5303A;color:#fff;height:100%;display:flex;align-items:center;padding:0 10px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;gap:6px;position:relative;z-index:1}
.tk .lb i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
.tk .mq{flex:1;overflow:hidden;white-space:nowrap}
.tk .tr{display:inline-block;padding-left:100%;animation:mq 46s linear infinite;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tk:hover .tr{animation-play-state:paused}
.tk .tr b{font-weight:800;color:var(--ink);margin:0 4px}
@keyframes mq{to{transform:translateX(-100%)}}

/* ===== Cuerpo: cards en columnas ===== */
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1)}
.open .bd{grid-template-rows:1fr}
.bd>.in{overflow:hidden;min-height:0}
.pad{padding:12px 18px 18px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.sec{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.num{font-variant-numeric:tabular-nums}
.msg{font-size:13px;line-height:1.55;font-weight:500;color:var(--ink)}
.solo{display:grid;gap:14px}

/* Menú interno + carrusel horizontal */
.tabs{position:relative;display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{background:none;border:0;padding:11px 14px;font:600 11.5px var(--f);color:var(--mut);cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0;transition:color .2s,background .2s}
.tb:hover{color:var(--brand);background:var(--card)}
.tb.on{color:var(--brand);font-weight:700}
.tb .ct{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;background:var(--band);color:var(--brand);border-radius:9px;padding:1px 6px}
.ink{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);border-radius:2px;width:var(--w,0);transform:translateX(var(--x,0));transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1)}
.arr{margin-left:auto;display:flex;gap:6px;padding:0 0 0 12px;flex:none;position:sticky;right:0;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 14px)}
.arr button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .2s}
.arr button:hover:not(:disabled){background:var(--brand);color:#fff;transform:scale(1.1)}
.arr button:active:not(:disabled){transform:scale(.94)}
.arr button:disabled{opacity:.3;cursor:default}
.arr svg{width:14px;height:14px}
.vp{overflow:hidden;transition:height .5s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.trk2{display:flex;align-items:flex-start;transition:transform .6s cubic-bezier(.2,.8,.2,1);will-change:transform}
.pn{flex:0 0 100%;min-width:0;display:grid;gap:14px;grid-template-columns:1fr;visibility:hidden;transition:visibility 0s .6s}
.pn.on{visibility:visible;transition-delay:0s}
@media (min-width:820px){
  .pn.p-res{grid-template-columns:1fr 1fr}
  .pn.p-res .blk.top{grid-column:1/-1}
  .map .mp{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)!important;gap:30px!important}
}

.top .tp{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
@media (min-width:820px){.top .tp{grid-template-columns:1.4fr 1fr;gap:28px}}
.verdict{border-left:4px solid var(--c,var(--brand));padding:2px 0 2px 16px}
.verdict .tg{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--brand))}
.verdict h3{font-weight:700;font-size:clamp(17px,3.1vw,22.5px);line-height:1.22;margin-top:5px;text-wrap:balance;letter-spacing:-.01em}
.verdict p{font-size:11px;color:var(--mut);margin-top:6px}
.cnt .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11px;color:var(--mut)}
.cnt .l b{font-size:27px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.cnt .l b small{font-size:.55em;color:var(--brand)}
.prog{height:6px;background:#fff;border:1px solid var(--line);margin-top:8px;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transform-origin:left}
.cnt .w{font-size:10.5px;color:var(--mut);margin-top:7px}

/* Podio con fotos redondas y pestaña con el porcentaje */
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pod .p{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:transform .25s;padding:4px 2px;border-radius:8px}
.pod .p:hover{transform:translateY(-4px)}
.pod .ph{width:clamp(74px,12vw,100px);height:clamp(74px,12vw,100px);border-radius:50%;object-fit:cover;object-position:50% 14%;border:3px solid var(--brand);background:#cfd8ea;position:relative;z-index:1;transition:transform .3s,box-shadow .3s}
.pod .p:hover .ph{transform:scale(1.06);box-shadow:0 10px 22px rgba(15,55,133,.28)}
.pod .tab{margin-top:-16px;min-width:clamp(70px,11vw,92px);background:var(--brand);color:#fff;border-radius:0 0 12px 12px;padding:20px 8px 7px;font-weight:800;font-size:clamp(14.5px,2.3vw,18px);transition:background .2s}
.pod .tab small{font-size:.62em;font-weight:700}
.pod h4{font-weight:700;font-size:clamp(11.5px,1.8vw,13.5px);line-height:1.2;color:var(--brand);margin-top:9px}
.pod h4.nm2{min-height:2.4em;justify-content:center}
.pod .pt{min-height:2.4em;font-size:10.5px;font-weight:600;color:var(--ink);margin-top:2px}
.pod .vt{font-size:10px;color:var(--mut);margin-top:1px}
.pod .p.first .ph{border-color:var(--gold);box-shadow:0 0 0 2px var(--brand)}
/* Podio: el que va primero al centro (más grande y un poco más arriba), el 2º a la izquierda y el 3º a la derecha */
.pod{align-items:start}
.pod .p{order:3}.pod .p.first{order:2}.pod .p.second{order:1}
.pod .p.first{margin-top:-10px}
.pod .p.first .ph{width:clamp(88px,14vw,118px);height:clamp(88px,14vw,118px)}
.pod .p.first .tab{min-width:clamp(80px,12.5vw,104px);font-size:clamp(16px,2.6vw,21px)}
.pod .p.first h4{font-size:clamp(12.5px,2vw,15px)}
.pod .p.sel .ph{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}
.pod .p.sel .tab{background:var(--c)}

.rows{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.rw{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 54px 92px;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:4px;font-size:11.5px;cursor:pointer;transition:transform .2s,border-color .2s,background .2s;overflow:hidden}
.rw::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:calc(var(--w,0) * 1%);background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.rw:hover{transform:translateX(3px);border-color:var(--brand)}
.rw:hover::after,.rw.sel::after{transform:scaleX(1)}
.rw.sel{border-color:var(--c);background:#F8FAFE}
.rw .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .n b{font-weight:700}
.rw .n span{color:var(--mut)}
.rw .pc{font-weight:800;text-align:right;font-size:12.5px}
.rw .v{text-align:right;color:var(--mut);font-size:10px}
.rw .sw{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:2px;background:var(--c)}
.hint{font-size:11px;color:var(--mut);margin-top:14px;min-height:20px}
.hint b{color:var(--ink)}
.go{background:none;border:0;color:var(--brand);font:700 11px var(--f);cursor:pointer;padding:0;transition:transform .2s;display:inline-block}
.go:hover{transform:translateX(3px);text-decoration:underline}
.c5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cc{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:transform .25s,box-shadow .25s}
.cc:hover{transform:translateY(-5px);box-shadow:0 12px 24px rgba(15,55,133,.14)}
.cc>b{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.cc img,.cc .ini{width:70px;height:70px;border-radius:50%;object-fit:cover;object-position:50% 14%;border:3px solid var(--c);background:#cfd8ea;margin-top:4px;transition:transform .3s}
.cc:hover img{transform:scale(1.08)}
.cc .wn{font-size:11px;font-weight:600;line-height:1.2;min-height:30px}
.cc .pc{font-size:27px;font-weight:800;letter-spacing:-.02em}
.cc .pc small{font-size:.5em;color:var(--brand)}
.cc .bar{width:100%;height:5px;border-radius:3px;background:var(--band);overflow:hidden}
.cc .bar i{display:block;height:100%;background:var(--c);border-radius:3px;transform-origin:left}

/* Mapa */
.map .mp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center}
.map svg{width:100%;height:auto;max-height:360px;display:block;margin:0 auto}
.map path{stroke:#fff;stroke-width:1.1;stroke-linejoin:round;cursor:pointer;transition:opacity .25s,filter .2s}
.map path:hover{filter:brightness(.88);stroke:var(--ink)}
.map path.dim{opacity:.18}
.leg{display:flex;flex-direction:column;gap:6px}
.leg .it{display:flex;align-items:center;gap:9px;font-size:11px;line-height:1.2;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .2s}
.leg .it:hover,.leg .it.sel{background:#fff}
.leg .it i{width:12px;height:12px;border-radius:2px;flex:none}
.leg .it em{margin-left:auto;font-style:normal;font-weight:800;font-size:16px}
.leg .n{font-size:10px;color:var(--mut);line-height:1.4;margin-top:4px}

/* Tablas de ganador por ciudad */
.tbl{background:#fff;border:1px solid var(--line);border-radius:4px}
.tr2{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) 52px;align-items:center;gap:10px;padding:8px 12px;font-size:11.5px;transition:background .2s}
.tr2+.tr2{border-top:1px solid var(--line)}
.tr2:hover{background:#F7F9FD}
.tr2 .c{font-weight:700;font-size:12.5px}
.tr2 .w{display:flex;align-items:center;gap:9px;min-width:0}
.tr2 .w img,.tr2 .w .ini{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 14%;border:2px solid var(--c);flex:none;background:#cfd8ea;transition:transform .25s}
.tr2:hover .w img{transform:scale(1.18)}
.tr2 .w span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr2 .pc{font-weight:800;text-align:right;font-size:12.5px}

.ab{display:grid;gap:14px}
@media (min-width:820px){.ab{grid-template-columns:.9fr 1.1fr 1.1fr;align-items:start}}
.box{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:4px}
.box div{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
.box div:nth-child(odd){border-right:1px solid var(--line)}
.box div:nth-last-child(-n+2){border-bottom:0}
.box span{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.box b{display:block;font-size:15.5px;font-weight:800;margin-top:2px}
.ab .rows{margin-top:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 10px}
.cand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;cursor:default;transition:transform .25s}
.cand:hover{transform:translateY(-3px)}
.cand img,.cand .ini{width:78px;height:78px;border-radius:50%;object-fit:cover;object-position:50% 14%;border:3px solid var(--brand);background:#cfd8ea;transition:box-shadow .3s}
.cand:hover img{box-shadow:0 8px 18px rgba(15,55,133,.25)}
.cand b{font-weight:700;font-size:11.5px;line-height:1.2;color:var(--brand)}
.cand small{font-size:10px;color:var(--mut);line-height:1.25;min-height:2.5em}
.nm2{display:flex;flex-direction:column;align-items:center}
.nm2 .l1,.nm2 .l2{display:block;white-space:nowrap}
.cand b.nm2{min-height:2.4em;justify-content:center}
.ini{display:flex;align-items:center;justify-content:center;color:#fff;font:700 13.5px var(--f);background:var(--brand)}

.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 18px;padding:12px 0 16px;border-top:1px solid var(--ink);font-size:10.5px;color:var(--mut)}
.foot a{color:var(--ink);font-weight:700;text-decoration:none;transition:color .2s}
.foot a:hover{color:var(--brand)}

/* Entrada de cada panel al mostrarse */
.pn.show .blk{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.pn.show .blk:nth-child(2){animation-delay:.09s}.pn.show .blk:nth-child(3){animation-delay:.18s}
.pn.show .prog i,.pn.show .cc .bar i{animation:grow 1.2s .35s cubic-bezier(.2,.8,.2,1) both}
.pn.show .pod .p{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--j,0) * 110ms)}
.pn.show .rw,.pn.show .tr2{animation:up .45s ease both;animation-delay:calc(.4s + var(--j,0) * 45ms)}
.pn.show .cc{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--j,0) * 90ms)}
.pn.show .map path{animation:fadeIn .6s ease both;animation-delay:calc(.1s + var(--j,0) * 22ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (max-width:520px){.hd{padding:20px 18px 0}.tl span{font-size:9px;letter-spacing:.04em}.tl li:not(.on) span{display:none}.pad{padding:12px}.blk{padding:14px}.map .mp{grid-template-columns:1fr}.rw{grid-template-columns:minmax(0,1fr) 50px}.rw .v{display:none}.tr2{grid-template-columns:90px minmax(0,1fr) 46px}.foot{margin:0 12px}.status{font-size:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.static *,.static *::before,.static *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="bv" id="bv">
  <header class="hd" id="hd" role="button" tabindex="0" aria-expanded="false" aria-controls="bd">
    <div class="kick">Especial Cíclico</div>
    <div class="ttl">
      <svg class="flag" viewBox="0 0 72 50" aria-hidden="true"><rect width="72" height="50" fill="#009C3B"/><polygon points="36,4 68,25 36,46 4,25" fill="#FFDF00"/><circle cx="36" cy="25" r="11" fill="#002776"/><path d="M25.2 22.5c7-2 15-.6 21.4 3.6" stroke="#fff" stroke-width="2.2" fill="none"/></svg>
      <div class="tt"><h1 id="t" aria-label="Brasil Vota Presidente"></h1><div class="sub" id="sub">Primera vuelta</div></div>
    </div>
    <ol class="tl" id="tl" aria-label="Etapas de la elección"></ol>
    <div class="row">
      <div class="status" id="status">Cargando…</div>
      <button class="more" id="more" type="button" aria-label="Abrir o cerrar resultados"><span id="moreTxt">Ver resultados</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </header>

<script>

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

    var k2 = 0, svg = mapa ? '<svg viewBox="' + mapa.viewBox.join(" ") + '" role="img" aria-label="Mapa de Brasil: ganador por estado">' + mapa.regions.map(function (r) {
      var s = by[r.id], c = s && s.winner >= 0 ? d.candidates[s.winner] : null, k = c ? Math.min(1, Math.max(0, ((s.pct || 55) - 30) / 40)) : 0;

        var c = d.candidates[r.i]; return c ? '<div class="rw" data-cand="' + r.i + '" style="--c:' + tone(c.color) + ";--w:" + r.pct + ";--j:" + i + '"><div class="n"><i class="sw"></i><b>' + (i + 1) + ". " + esc(c.name) + '</b></div><div class="pc num">' + pct(r.pct) + '%</div><div class="v num">Votos: ' + num(r.votes) + "</div></div>" : "";

  }

  }

  function panelsFor(d) {

    return ps;
  }
  var CH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  var CR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  var animNext = false, startTab = Q.get("tab");
  function render() {
    var d = data; if (!d) return;
    $("sub").textContent = d.round === 2 ? "Segunda vuelta" : "Primera vuelta";

    var hasRes = d.available && d.candidates.length >= 2 && d.counted_pct > 0, html;
    $("status").innerHTML = "<b>" + esc(d.phase_label) + "</b>" + (hasRes ? " · escrutinio " + pct(d.counted_pct) + " %" : "");
    $("src").textContent = "Fuente: " + d.source;

      html = '<div class="tabs" role="tablist" id="tabs">' + ps.map(function (p, i) { return '<button class="tb" role="tab" data-tab="' + i + '">' + p.label + (p.ct ? '<span class="ct">' + p.ct + "</span>" : "") + "</button>"; }).join("") + '<i class="ink" id="ink"></i><div class="arr"><button type="button" data-dir="-1" aria-label="Anterior">' + CH + '</button><button type="button" data-dir="1" aria-label="Siguiente">' + CR + "</button></div></div>" +
        '<div class="vp" id="vp"><div class="trk2" id="trk2">' + ps.map(function (p) { return '<div class="pn ' + (p.cls || "") + '" data-k="' + p.k + '">' + p.html + "</div>"; }).join("") + "</div></div>";

  var panelRO = null, tab = 0;
  function fitHeight() { var pn = document.querySelectorAll("#content .pn"), vp = $("vp"); if (vp && pn[tab]) vp.style.height = pn[tab].offsetHeight + "px"; }
  // Cambia de panel: el carrusel corre en horizontal, la altura se ajusta y el indicador del menú se desliza.

  // Microinteracciones ---------------------------------------------------------------------------------------------

  function applyFocus() {

  // 2) Al abrir, los porcentajes cuentan desde cero.

      (function step(now) { var k = Math.min(1, Math.max(0, (now - t0) / 1100)); el.textContent = pct(v * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
    });

  function setOpen(v) {
    open = v; $("bv").classList.toggle("open", open); $("hd").setAttribute("aria-expanded", open);
    if (open) animNext = true;
    if (open && !mapa) fetch(API + "/widgets/brasil-mapa.json").then(function (r) { return r.json(); }).then(function (m) {
      mapa = m; var el = document.querySelector("#content .blk.map"); if (el && data) { el.innerHTML = mapBlock(data); applyFocus(); fitHeight(); }
    }).catch(function () {});
    render(); setTimeout(report, 700);
  }
  $("hd").addEventListener("click", function () { setOpen(!open); });
  $("hd").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen(!open); } });

  function report() { try { parent.postMessage({ type: "brasil-vota:height", height: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*"); } catch (e) {} }
  if (window.ResizeObserver) new ResizeObserver(report).observe($("bv"));
  window.addEventListener("resize", report);

  // ---- Datos de muestra (sólo ?demo=...): los 12 candidatos reales con cifras inventadas ----

    var P = [41.2, 37.8, 7.9, 4.1, 3.3, 2.2, 1.4, 0.8, 0.5, 0.4, 0.2, 0.2], pre = base.preload;

    var TOT = 118400000, cands = pre.map(function (c, i) { return { name: c.name, party: c.party, color: c.color, photo_url: c.photo_url, pct: P[i], votes: Math.round(TOT * P[i] / 100) }; });
    var UF = { AC: [1, 58], AL: [0, 61], AP: [0, 52], AM: [0, 49], BA: [0, 64], CE: [0, 66], DF: [1, 54], ES: [1, 51], GO: [1, 56], MA: [0, 69], MT: [1, 60], MS: [1, 57], MG: [0, 48], PA: [0, 50], PB: [0, 62], PR: [1, 55], PE: [0, 63], PI: [0, 71], RJ: [1, 47], RN: [0, 59], RS: [1, 50], RO: [1, 62], RR: [1, 65], SC: [1, 63], SP: [1, 46], SE: [0, 60], TO: [1, 53] };
    var states = Object.keys(UF).map(function (id) { return { id: id, winner: UF[id][0], pct: UF[id][1], votes: 1000000 }; });
    var cities = [["São Paulo", 1, 44.3], ["Rio de Janeiro", 1, 46.8], ["Salvador", 0, 66.1], ["Belo Horizonte", 0, 45.2], ["Brasília", 1, 52.7]].map(function (x, i) { return { id: String(i), name: x[0], uf: "", counted_pct: 99, top: [{ i: x[1], pct: x[2], votes: 0 }] }; });
    var abroad = { country_name: "Argentina", electorate: 13138, cities: [{ name: "Buenos Aires", electorate: 9612, top: [{ i: 0, votes: 2540, pct: 49.2 }] }, { name: "Córdoba", electorate: 1894, top: [{ i: 1, votes: 520, pct: 41.3 }] }, { name: "Otras ciudades", electorate: 1632, top: [{ i: 0, votes: 402, pct: 44.8 }] }],
      bulletins_expected: 41, bulletins_received: 37, bulletins_totalized: 34, totalized_pct: 82.9, updated_at: "2026-10-04T18:42:10-03:00", candidates: [{ i: 0, votes: 3412, pct: 47.9 }, { i: 1, votes: 2305, pct: 32.4 }, { i: 2, votes: 598, pct: 8.4 }] };
    var d = { phase: "resultados", phase_label: "Primeros resultados", outcome: "open", available: true, counted_pct: 91.3, updated_at: "2026-10-04T18:42:10-03:00", version: "demo-" + kind, candidates: cands, states: states, cities: cities, abroad: abroad, preload: pre, source: base.source };
    if (kind === "runoff") { d.phase = "preliminar"; d.phase_label = "Conteo preliminar"; d.outcome = "runoff"; }
    if (kind === "ganador") { d.phase = "definitivo"; d.phase_label = "Resultado final"; d.outcome = "winner"; d.counted_pct = 100; }
    if (kind === "pre") { d.available = false; d.candidates = []; d.states = []; d.cities = []; d.abroad = null; d.phase = "pre"; d.phase_label = "Elecciones el domingo 4 de octubre"; }
    if (kind === "apertura") { d.available = false; d.candidates = []; d.states = []; d.cities = []; d.abroad = null; d.phase = "apertura"; d.phase_label = "Comicios abiertos"; }
    return d;
  }

  function load() {
    fetch(API + "/api/tse/widget/br-presidente", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { data = DEMO ? demo(DEMO, j) : j; render(); }).catch(function () { if (!data) { $("status").textContent = "Brasil vota"; } });
  }
  load(); if (!DEMO) setInterval(load, POLL);
  if (Q.get("open") === "1") setOpen(true);
})();
